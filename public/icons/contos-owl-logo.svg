  <path d="M164 214C164 176 206 164 256 192C306 164 348 176 348 214C348 254 312 276 256 276C200 276 164 254 164 214Z" fill="#FFFDF9" stroke="#F59E0B" stroke-width="4" />

  <!-- Olhos Grandes Expressivos estilo Pixar/Storybook -->
  <circle cx="212" cy="216" r="36" fill="#FFFFFF" stroke="#D97706" stroke-width="4.5" />
  <circle cx="214" cy="216" r="25" fill="url(#iris_teal)" />
  <circle cx="214" cy="216" r="16" fill="#134E4A" />
  <circle cx="205" cy="206" r="8" fill="#FFFFFF" />
  <circle cx="222" cy="224" r="3.8" fill="#FFFFFF" />

  <circle cx="300" cy="216" r="36" fill="#FFFFFF" stroke="#D97706" stroke-width="4.5" />
  <circle cx="298" cy="216" r="25" fill="url(#iris_teal)" />
  <circle cx="298" cy="216" r="16" fill="#134E4A" />
  <circle cx="289" cy="206" r="8" fill="#FFFFFF" />
  <circle cx="306" cy="224" r="3.8" fill="#FFFFFF" />

