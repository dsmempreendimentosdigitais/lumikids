<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo App Store / Play Store Squircle na Identidade Visual Contos & Virtudes (Teal Esmeralda Profundo) -->
  <rect width="512" height="512" rx="124" fill="url(#bg_teal_grad)" />
  <rect x="10" y="10" width="492" height="492" rx="116" stroke="url(#gold_rim_grad)" stroke-width="6" opacity="0.55" />

  <!-- Halo Dourado Acolhedor Central -->
  <circle cx="256" cy="252" r="195" fill="url(#warm_halo)" />

  <!-- Estrelinhas Douradas Mágicas ao Redor -->
  <path d="M98 132L104 148L120 154L104 160L98 176L92 160L76 154L92 148Z" fill="#FEF08A" opacity="0.92" />
  <path d="M416 122L422 136L436 142L422 148L416 162L410 148L396 142L410 136Z" fill="#FEF08A" opacity="0.95" />
  <path d="M424 342L428 352L438 356L428 360L424 370L420 360L410 356L420 352Z" fill="#FDE047" opacity="0.85" />
  <path d="M88 336L92 346L102 350L92 354L88 364L84 354L74 350L84 346Z" fill="#FDE047" opacity="0.85" />
  <circle cx="152" cy="96" r="5" fill="#FFFBEB" opacity="0.85" />
  <circle cx="364" cy="92" r="4.5" fill="#FFFBEB" opacity="0.8" />
  <circle cx="256" cy="68" r="6" fill="#FDE047" opacity="0.9" />

