  <path d="M148 214C134 166 154 118 192 142C214 130 236 126 256 126C276 126 298 130 320 142C358 118 378 166 364 214C376 244 366 282 340 294H172C146 282 136 244 148 214Z" fill="url(#owl_head_gold)" stroke="#B45309" stroke-width="6" stroke-linejoin="round" />

