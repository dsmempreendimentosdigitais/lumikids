  <path d="M222 308Q232 320 242 308" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.55" />
  <path d="M246 308Q256 320 266 308" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.55" />
  <path d="M270 308Q280 320 290 308" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.55" />
  <path d="M234 334Q244 346 254 334" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />
  <path d="M258 334Q268 346 278 334" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />

