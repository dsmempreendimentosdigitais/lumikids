  <path d="M242 232Q256 224 270 232L256 256Z" fill="url(#beak_grad)" stroke="#9A3412" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Lencinho / Gola de Aventureira Verde-Teal com Estrela Dourada -->
  <path d="M180 272Q256 302 332 272L314 298Q256 322 198 298Z" fill="#0D9488" stroke="#0F766E" stroke-width="4" stroke-linejoin="round" />
  <path d="M240 288L256 318L272 288Z" fill="#14B8A6" stroke="#0F766E" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="256" cy="292" r="7" fill="#FDE047" stroke="#B45309" stroke-width="2" />

  <!-- Livro Aberto Iluminado nas Patinhas (Símbolo de Contos & Virtudes) -->
  <g transform="translate(0, 6)">
    <path d="M168 386C196 374 232 378 256 392C280 378 316 374 344 386L336 424C310 414 278 416 256 430C234 416 202 414 176 424Z" fill="#FFFDF9" stroke="#B45309" stroke-width="5" stroke-linejoin="round" />
    <path d="M174 378C200 366 232 370 256 384C280 370 312 366 338 378L332 414C308 404 278 406 256 420C234 406 204 404 180 414Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="256" y1="384" x2="256" y2="426" stroke="#B45309" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="204" cy="422" rx="22" ry="12" fill="#F97316" stroke="#9A3412" stroke-width="4" />
    <ellipse cx="308" cy="422" rx="22" ry="12" fill="#F97316" stroke="#9A3412" stroke-width="4" />
  </g>

  <!-- Pequena Coroa / Estrela de Virtude no Topo da Cabeça -->
  <path d="M234 124L242 102L256 114L270 102L278 124Z" fill="#FDE047" stroke="#B45309" stroke-width="3.5" stroke-linejoin="round" />

  <defs>
    <linearGradient id="bg_teal_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="gold_rim_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="warm_halo" cx="0.5" cy="0.5" r="0.5" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 252) scale(195)">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.42" />
      <stop offset="65%" stop-color="#14B8A6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="owl_head_gold" x1="256" y1="126" x2="256" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="owl_body_gold" x1="256" y1="174" x2="256" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="wing_amber" x1="0" y1="260" x2="0" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="belly_cream" x1="256" y1="236" x2="256" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <radialGradient id="iris_teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </radialGradient>

    <linearGradient id="beak_grad" x1="256" y1="228" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
